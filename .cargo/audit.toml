# cargo-audit configuration. Vulnerabilities fail unless listed below; unsound/unmaintained
# are reported as warnings (several come from upstream git2/lru and have no fix yet).
[advisories]
ignore = [
  # quick-xml 0.30 comes from slint 1.10 -> accesskit_unix -> atspi -> zbus_xml (Linux
  # a11y D-Bus introspection only; trusted local input). Fixed once slint bumps zbus.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]
