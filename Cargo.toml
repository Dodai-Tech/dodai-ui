[workspace]
members = [
    "crates/dodai-motion",
    "crates/dodai-core",
    "crates/dodai",
    "crates/dodai-cyberpunk",
    "crates/dodai-material",
    "crates/dodai-neobrutalism",
    "crates/dodai-aurora",
    "crates/dodai-charts-core",
    "crates/dodai-shaders",
    "crates/dodai-shaders-kernels",
    "crates/dodai-icon-id",
    "crates/dodai-icons-core",
    "crates/dodai-icons",
    "crates/dodai-cyberpunk-icons",
    "crates/dodai-material-icons",
    "crates/dodai-aurora-icons",
    "crates/dodai-ratatui",
    "crates/dodai-iced",
    "crates/dodai-gpui",
    "crates/dodai-topcoat",
    "crates/dodai-egui",
    "crates/dodai-slint",
    "crates/dodai-dioxus",
    "crates/dodai-leptos",
    "crates/dodai-yew",
    "crates/dodai-bevy",
    "crates/dodai-freya",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/dodai-ui"
rust-version = "1.85"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin once here; each crate references them with `{ workspace = true }`.

[workspace.dependencies]
# TUI
ratatui   = "0.30"
crossterm = "0.29"
# GUI
iced      = { version = "0.14", features = ["advanced", "canvas"] }
gpui      = "0.2.2"

# Internal crates
dodai-core    = { path = "crates/dodai-core",    version = "0.1.0" }
dodai         = { path = "crates/dodai",         version = "0.1.0", default-features = false }
dodai-cyberpunk = { path = "crates/dodai-cyberpunk", version = "0.1.0", default-features = false }
dodai-material = { path = "crates/dodai-material", version = "0.1.0", default-features = false }
dodai-neobrutalism = { path = "crates/dodai-neobrutalism", version = "0.1.0", default-features = false }
dodai-aurora = { path = "crates/dodai-aurora", version = "0.1.0", default-features = false }
dodai-motion = { path = "crates/dodai-motion", version = "0.1.0" }
dodai-charts-core = { path = "crates/dodai-charts-core", version = "0.1.0" }
dodai-shaders = { path = "crates/dodai-shaders", version = "0.1.0" }
dodai-icon-id = { path = "crates/dodai-icon-id", version = "0.1.0" }
dodai-icons-core = { path = "crates/dodai-icons-core", version = "0.1.0" }
dodai-icons = { path = "crates/dodai-icons", version = "0.1.0", default-features = false }
dodai-cyberpunk-icons   = { path = "crates/dodai-cyberpunk-icons",   version = "0.1.0", default-features = false }
dodai-material-icons = { path = "crates/dodai-material-icons", version = "0.1.0" }
dodai-aurora-icons = { path = "crates/dodai-aurora-icons", version = "0.1.0" }
dodai-ratatui = { path = "crates/dodai-ratatui", version = "0.1.0" }
dodai-iced    = { path = "crates/dodai-iced",    version = "0.1.0" }
dodai-gpui    = { path = "crates/dodai-gpui",    version = "0.1.0" }
dodai-topcoat = { path = "crates/dodai-topcoat", version = "0.1.0" }
dodai-egui    = { path = "crates/dodai-egui", version = "0.1.0" }
dodai-slint   = { path = "crates/dodai-slint", version = "0.1.0" }
dodai-dioxus  = { path = "crates/dodai-dioxus", version = "0.1.0" }
dodai-leptos  = { path = "crates/dodai-leptos", version = "0.1.0" }
dodai-yew     = { path = "crates/dodai-yew", version = "0.1.0" }
dodai-bevy    = { path = "crates/dodai-bevy", version = "0.1.0" }
dodai-freya   = { path = "crates/dodai-freya", version = "0.1.0" }

[profile.dev]
opt-level = 1

# Dependencies (gpui, taffy, lyon, ...) dominate frame time; keep them optimised
# even in debug builds so UI stays interactive.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# Shaders are per-pixel maths: always optimise them.
[profile.dev.package.dodai-shaders]
opt-level = 3
