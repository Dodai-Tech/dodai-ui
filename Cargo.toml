[workspace]
members = [
    "crates/dodai-core",
    "crates/dodai-charts",
    "crates/dodai-dash",
    "crates/dodai-instruments",
    "crates/dodai-fx",
    "crates/dodai-frost",
    "crates/dodai-shaders",
    "crates/dodai-icons",
    "crates/dodai-ratatui",
    "crates/dodai-iced",
    "crates/dodai-gpui",
    "crates/dodai-showcase",
    "crates/dodai-showcase-model",
    "crates/dodai-topcoat",
    "crates/dodai-egui",
    "crates/dodai-slint",
    "crates/dodai-dioxus",
    "crates/dodai-leptos",
    "crates/dodai-yew",
    "crates/dodai-bevy",
]
resolver = "2"
# Own workspace (own Skia, own lockfile): see crates/dodai-freya/Cargo.toml.
exclude = ["crates/dodai-freya", "tools/shaders-kernels"]

[workspace.package]
version      = "0.1.5"
edition      = "2021"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/Dodai-Tech/dodai-ui"
rust-version = "1.85"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin once here; each crate references them with `{ workspace = true }`.

[workspace.dependencies]
# TUI
ratatui   = "0.30"
crossterm = "0.29"
# GUI
iced      = { version = "0.14", features = ["advanced", "canvas"] }
gpui      = "0.2.2"
# macOS Dock icon of the showcase
objc2            = "0.6"
objc2-app-kit    = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Internal crates
dodai-core    = { path = "crates/dodai-core",    version = "0.1.5" }
dodai-fx = { path = "crates/dodai-fx", version = "0.1.5" }
dodai-frost = { path = "crates/dodai-frost", version = "0.1.5" }
dodai-charts      = { path = "crates/dodai-charts", version = "0.1.5" }
dodai-instruments = { path = "crates/dodai-instruments", version = "0.1.5" }
dodai-shaders = { path = "crates/dodai-shaders", version = "0.1.5" }
dodai-icons = { path = "crates/dodai-icons", version = "0.1.5", default-features = false }
dodai-showcase-model = { path = "crates/dodai-showcase-model" }
dodai-gpui    = { path = "crates/dodai-gpui",    version = "0.1.5", default-features = false }
dodai-topcoat = { path = "crates/dodai-topcoat", version = "0.1.5" }

[profile.dev]
opt-level = 1

# Dependencies (gpui, taffy, lyon, ...) dominate frame time; keep them optimised
# even in debug builds so UI stays interactive.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# Shaders are per-pixel maths: always optimise them.
[profile.dev.package.dodai-shaders]
opt-level = 3

