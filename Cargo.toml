[workspace]
members = [
    "crates/dodai-ui-core",
    "crates/dodai-ui-charts",
    "crates/dodai-ui-dash",
    "crates/dodai-ui-fx",
    "crates/dodai-ui-frost",
    "crates/dodai-ui-shaders",
    "crates/dodai-ui-icons",
    "crates/dodai-ui-ratatui",
    "crates/dodai-ui-iced",
    "crates/dodai-ui-gpui",
    "crates/dodai-ui-showcase",
    "crates/dodai-ui-showcase-model",
    "crates/dodai-ui-showcase-web",
    "crates/dodai-ui-topcoat",
    "crates/dodai-ui-egui",
    "crates/dodai-ui-slint",
    "crates/dodai-ui-dioxus",
    "crates/dodai-ui-leptos",
    "crates/dodai-ui-yew",
    "crates/dodai-ui-bevy",
    "crates/dodai-ui-spec",
    "crates/dodai-ui-gen",
]
resolver = "2"
# Own workspaces: freya (own Skia) and xilem (its wgpu/naga 26 does not unify with gpui and
# iced), each with its own lockfile: see their Cargo.toml.
exclude = ["crates/dodai-ui-freya", "crates/dodai-ui-xilem", "tools/shaders-kernels"]

[workspace.package]
version      = "0.1.6"
edition      = "2021"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/Dodai-Tech/dodai-ui"
rust-version = "1.85"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin once here; each crate references them with `{ workspace = true }`.

[workspace.dependencies]
# TUI
ratatui   = "0.30"
crossterm = "0.29"
# GUI
iced      = { version = "0.14", features = ["advanced", "canvas"] }
gpui      = "0.2.2"
# macOS Dock icon of the showcase
objc2            = "0.6"
objc2-app-kit    = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Internal crates
dodai-ui-spec    = { path = "crates/dodai-ui-spec",  version = "0.1.6" }
dodai-ui-core    = { path = "crates/dodai-ui-core",    version = "0.1.6" }
dodai-ui-fx = { path = "crates/dodai-ui-fx", version = "0.1.6" }
dodai-ui-frost = { path = "crates/dodai-ui-frost", version = "0.1.6" }
dodai-ui-charts      = { path = "crates/dodai-ui-charts", version = "0.1.6" }
dodai-ui-shaders = { path = "crates/dodai-ui-shaders", version = "0.1.6" }
dodai-ui-icons = { path = "crates/dodai-ui-icons", version = "0.1.6", default-features = false }
dodai-ui-showcase-model = { path = "crates/dodai-ui-showcase-model" }
dodai-ui-gpui    = { path = "crates/dodai-ui-gpui",    version = "0.1.6", default-features = false }
dodai-ui-topcoat = { path = "crates/dodai-ui-topcoat", version = "0.1.6" }

[profile.dev]
opt-level = 1

# Dependencies (gpui, taffy, lyon, ...) dominate frame time; keep them optimised
# even in debug builds so UI stays interactive.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# Shaders are per-pixel maths: always optimise them.
[profile.dev.package.dodai-ui-shaders]
opt-level = 3

