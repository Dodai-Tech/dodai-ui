[package]
name = "dodai-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dodai-core = { path = "../crates/dodai-core", features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
dodai-charts = { path = "../crates/dodai-charts" }
dodai-icons = { path = "../crates/dodai-icons", features = ["cyberpunk", "material"] }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "svg_path"
path = "fuzz_targets/svg_path.rs"
test = false
doc = false

[[bin]]
name = "polygons"
path = "fuzz_targets/polygons.rs"
test = false
doc = false

[[bin]]
name = "icon_names"
path = "fuzz_targets/icon_names.rs"
test = false
doc = false

[[bin]]
name = "theme_lookup"
path = "fuzz_targets/theme_lookup.rs"
test = false
doc = false

[[bin]]
name = "charts_math"
path = "fuzz_targets/charts_math.rs"
test = false
doc = false

[[bin]]
name = "shape_tune"
path = "fuzz_targets/shape_tune.rs"
test = false
doc = false

[[bin]]
name = "color_math"
path = "fuzz_targets/color_math.rs"
test = false
doc = false
