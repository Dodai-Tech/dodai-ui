name: kernels

# Full rust-gpu rebuild; slow (installs a pinned nightly), so weekly, manual, and on pushes
# that touch the shader sources or the kernel crate (so a stale kernels.wgsl is caught at once).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/dodai-ui-shaders/src/shaders/**"
      - "tools/shaders-kernels/**"
      - "crates/dodai-ui-shaders/kernels.wgsl"
      - "scripts/gen-kernels.nu"
      - ".github/workflows/kernels.yml"
  schedule:
    - cron: "0 4 * * 1"

jobs:
  wgsl-in-sync:
    name: kernels.wgsl in sync with the shader sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        id: rt1
        continue-on-error: true
      - name: Retry toolchain install (runner network is flaky)
        if: steps.rt1.outcome == 'failure'
        run: sleep 20
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rt1.outcome == 'failure'
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-gpu --locked
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - run: |
          nu scripts/gen-kernels.nu
          cd tools/shaders-kernels
          cargo gpu build --shader-crate . --output-dir ../../target/kernels --auto-install-rust-toolchain --target spirv-unknown-naga-wgsl
          cp ../../target/kernels/dodai_shaders_kernels.wgsl ../../crates/dodai-ui-shaders/kernels.wgsl
      - name: Fail if kernels.wgsl changed
        # The SSA temporaries (`phi_NNNN_`) are numbered differently between rust-gpu builds;
        # only a real change to the code counts.
        run: |
          git diff --exit-code -- tools/shaders-kernels/src/entries.rs
          norm() { sed -E 's/phi_[0-9]+_/phi_N_/g'; }
          git show HEAD:crates/dodai-ui-shaders/kernels.wgsl | norm > /tmp/kernels.committed
          norm < crates/dodai-ui-shaders/kernels.wgsl > /tmp/kernels.built
          diff -u /tmp/kernels.committed /tmp/kernels.built
