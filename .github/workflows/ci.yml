name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The GPU entry points are generated from the ShaderInfo tables.
  kernels-entries:
    name: kernels entries in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen-kernels.py
      - run: git diff --exit-code -- crates/dodai-shaders-kernels/src/entries.rs

  # Base crates everything else depends on (dodai-gpui also uses dodai-icons
  # and dodai-charts-core).
  base:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [dodai-core, dodai-icons, dodai-charts-core]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.crate }}

  # One job per dependent crate; runs only once the base crates are green.
  # `gui: true` crates need native libs on Linux and also run on macOS.
  crate:
    needs: base
    name: ${{ matrix.crate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS runners exist only on GitHub; on self-hosted Gitea they would queue forever.
    if: matrix.os != 'macos-latest' || github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        crate: [dodai-ratatui, dodai-topcoat, dodai-dioxus]
        include:
          - { crate: dodai-iced, os: ubuntu-latest, gui: true }
          - { crate: dodai-iced, os: macos-latest, gui: true }
          - { crate: dodai-gpui, os: ubuntu-latest, gui: true }
          - { crate: dodai-gpui, os: macos-latest, gui: true }
          - { crate: dodai-bevy, os: ubuntu-latest, gui: true }
          - { crate: dodai-shaders, os: ubuntu-latest, gui: true }
          - { crate: dodai-shaders-gpu, os: ubuntu-latest, gui: true }
          - { crate: dodai-shaders-kernels, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI system libraries
        if: matrix.gui && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-xkb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libasound2-dev libudev-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.crate }}
      # Slices must compile alone: charts-only users get no components.
      - name: gpui feature slices
        if: matrix.crate == 'dodai-gpui'
        run: |
          cargo check -p dodai-gpui --no-default-features --features charts
          cargo check -p dodai-gpui --no-default-features --features components
          cargo check -p dodai-gpui --no-default-features --features shaders
          cargo check -p dodai-gpui --no-default-features --features gpu
          cargo check -p dodai-gpui --no-default-features

  nu-tests:
    name: nushell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - run: nu scripts/tests/run_all.nu

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-xkb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libasound2-dev libudev-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
