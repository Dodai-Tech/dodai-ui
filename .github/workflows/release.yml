name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          nu scripts/ci/validate_tag.nu "$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  gate:
    name: Quality gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-xkb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        id: rt1
        continue-on-error: true
        with:
          components: rustfmt,clippy
      - name: Retry toolchain install (runner network is flaky)
        if: steps.rt1.outcome == 'failure'
        run: sleep 20
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rt1.outcome == 'failure'
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - run: cargo fmt --all -- --check
      # One crate at a time, like ci.yml: the whole workspace cannot be built in one go (the
      # toolkits pull conflicting versions of shared crates when their features are unified).
      - name: Clippy and tests, crate by crate
        run: |
          for c in dodai-fx dodai-core dodai-frost dodai-icons dodai-gpui dodai-shaders dodai-iced dodai-topcoat dodai-dioxus dodai-bevy; do
            flags=""; [ "$c" = dodai-core ] && flags="--all-features"
            cargo clippy -p "$c" --all-targets $flags -- -D warnings
            cargo test -p "$c" --locked $flags
          done
      - run: nu scripts/tests/run_all.nu

  publish:
    name: Publish to crates.io
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-xkb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        id: rt2
        continue-on-error: true
      - name: Retry toolchain install (runner network is flaky)
        if: steps.rt2.outcome == 'failure'
        run: sleep 20
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rt2.outcome == 'failure'
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        # The order is defined once, in scripts/lib/versioning.nu.
        run: nu scripts/publish_all.nu

  github-release:
    name: GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - run: nu scripts/ci/release_notes.nu "${{ needs.validate.outputs.tag }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
