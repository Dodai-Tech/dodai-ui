name: Nightly Dependency Update

# Every night against main: `cargo upgrade` (compatible requirements only) and
# `cargo update`. If something changed, the same checks as CI run, and only then it is committed to
# main: a lockfile-only change as `chore(deps)`, a raised requirement as a patch release (the crates are
# libraries). Majors are never taken here. A second job squash-merges the open
# Dependabot pull requests.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

# Never cancel mid-run: a half-finished push would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update:
    name: cargo update, verify, commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # git-cliff reads the history for the changelog
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-xkb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libgl1-mesa-dev libvulkan-dev libfontconfig1-dev libasound2-dev libudev-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - name: Upgrade the compatible requirements and the lockfile
        run: |
          cargo install cargo-edit git-cliff --locked
          nu scripts/ci/deps_update.nu upgrade
      - name: Anything to do?
        id: diff
        run: nu scripts/ci/deps_update.nu changed >> "$GITHUB_OUTPUT"
      - name: Verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --exclude dodai-ui-bevy --all-targets -- -D warnings
          cargo test --locked --workspace --exclude dodai-ui-bevy
          nu scripts/tests/run_all.nu
          cargo clippy --locked --manifest-path crates/dodai-ui-freya/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/dodai-ui-freya/Cargo.toml
      - name: Commit the lockfile
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.release != 'true'
        run: nu scripts/ci/deps_update.nu commit "github-actions[bot]" "github-actions[bot]@users.noreply.github.com"
      # The dodai crates are libraries: a raised requirement is released as a patch.
      - name: Patch release
        if: steps.diff.outputs.release == 'true'
        run: nu scripts/ci/deps_update.nu release "github-actions[bot]" "github-actions[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}

  # The open Dependabot pull requests (GitHub Actions bumps; Cargo is handled above) are
  # squash-merged every night. Opt out with the label `no-automerge`. A pull request that
  # changes workflow files needs a token with the workflow scope: set the GH_PAT secret.
  dependabot:
    name: merge Dependabot pull requests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Merge them
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/dependabot" \
            --json number,isDraft,labels,mergeable,title > prs.json
          for n in $(jq -r '.[] | select(.isDraft | not) | select([.labels[].name] | index("no-automerge") | not) | .number' prs.json); do
            title=$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .title' prs.json)
            if gh pr merge "$n" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
              echo "#$n merged: $title"
            else
              echo "::warning::#$n not merged: $title"
            fi
          done
