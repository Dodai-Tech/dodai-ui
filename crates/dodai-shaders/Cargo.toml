[package]
name         = "dodai-shaders"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "Pure-Rust pixel shaders for the Dodai UI design system: cyberpunk, Material 3, Matrix, retro terminals, pixel-art platformers and more"
readme       = "README.md"
keywords     = ["shaders", "procedural", "crt", "retro", "design-system"]
categories   = ["graphics", "gui"]

[features]
default = []
# wgpu host: runs the same shaders on the GPU from the committed `kernels.wgsl`.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
dodai-core = { workspace = true }
wgpu     = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.24", optional = true, features = ["derive"] }

# Only for the rust-gpu build (`just build-kernels`).
[target.'cfg(target_arch = "spirv")'.dependencies]
spirv-std = "0.11.0"
glam      = { version = "0.34", default-features = false, features = ["bytemuck"] }

[dev-dependencies]
gpui  = { workspace = true }
image = { version = "0.25", default-features = false }

[[example]]
name = "gallery"

[[example]]
name = "parity"
required-features = ["gpu"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }
