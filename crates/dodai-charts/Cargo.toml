[package]
name                   = "dodai-charts"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description            = "Charts for the Dodai UI design system: renderer-agnostic maths and layout, plus interactive animated charts per toolkit (feature gpui): line, bar, pie, radar, heatmap, sankey, candlestick, treemap and 60 more"
readme                 = "README.md"
keywords               = ["charts", "plotting", "design-system", "visualization", "gpui"]
categories             = ["visualization", "gui"]

[features]
# The gpui chart set (`dodai_charts::gpui`).
gpui = ["dep:gpui", "dep:dodai-gpui"]
# The designs (their themes in `dodai_core::switcher()`), passed on to `dodai-gpui`, so one
# dependency line picks them; without any, the plain `neutral` theme is used.
dodai        = ["dodai-gpui?/dodai"]
cyberpunk    = ["dodai-gpui?/cyberpunk"]
material     = ["dodai-gpui?/material"]
neobrutalism = ["dodai-gpui?/neobrutalism"]

[dependencies]
dodai-core = { workspace = true }
dodai-gpui = { workspace = true, optional = true }
gpui       = { workspace = true, optional = true }

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
gpui       = { workspace = true, features = ["test-support"] }
