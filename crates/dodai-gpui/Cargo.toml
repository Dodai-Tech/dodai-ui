[package]
name         = "dodai-gpui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "GPUI components for the Dodai UI design system: 160+ themed widgets in Cyberpunk, Material 3, Neo-Brutalism and Dodai, with glow, glass and motion"
readme       = "README.md"
keywords     = ["theme", "design-system", "gpui", "cyberpunk"]
categories   = ["gui"]

[features]
default    = ["components", "cyberpunk", "material", "neobrutalism", "dodai", "symbol-groups"]
# Buttons, tables, dialogs, pickers, navigation, ...
components = ["dep:dodai-icons"]
# The Cyberpunk design (its stroked icon pack ships with `components`, which needs the pack's
# `IconName` list). Designs without their own pack draw the shared outline set.
cyberpunk = ["dodai-core/cyberpunk"]
# Material Symbols glyphs: `Icon` follows the theme (rounded themes draw Material icons)
# (every design draws the same names).
material = ["dodai-core/material", "symbols"]
# The bold Neo-Brutalism icon pack (`Icon` on themes that declare `IconSet::Bold`).
neobrutalism = ["dodai-core/neobrutalism", "components", "dodai-icons/neobrutalism"]
# Dodai: draws Material Symbols icons (no Material components), and ships
# the frosted-glass scene and page grid.
dodai = ["dodai-core/dodai", "symbols", "frost"]
# Frosted glass (`FrostedScene`): a blurred copy of a picture behind panels, via `dodai-frost`
# (blurred off the UI thread, on the GPU when there is one).
frost = ["dep:dodai-frost", "dodai-frost/gpu", "dep:image"]
# Material Symbols glyphs, drawn by Material and Dodai.
symbols = ["components", "dodai-icons/material"]

# The original dashboard symbols (`Icon::symbol`), one feature per group; `symbol-groups` is all five.
symbol-groups = ["symbols-vehicle", "symbols-medical", "symbols-military", "symbols-industrial", "symbols-aviation"]
symbols-vehicle = ["components", "dodai-icons/symbols-vehicle"]
symbols-medical = ["components", "dodai-icons/symbols-medical"]
symbols-military = ["components", "dodai-icons/symbols-military"]
symbols-industrial = ["components", "dodai-icons/symbols-industrial"]
symbols-aviation = ["components", "dodai-icons/symbols-aviation"]

[dependencies]
dodai-core = { workspace = true }
dodai-fx = { workspace = true }
dodai-frost = { workspace = true, optional = true }
dodai-icons = { workspace = true, features = ["theme", "cyberpunk"], optional = true }
gpui = { workspace = true }
# The machine's UTC offset, without FFI of our own.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Already in gpui's tree: tessellate icons once and replay the triangles each frame.
lyon_tessellation = "1"
image = { version = "0.25", default-features = false, optional = true }

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
gpui = { workspace = true, features = ["test-support"] }
