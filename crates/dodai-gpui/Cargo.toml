[package]
name         = "dodai-gpui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "GPUI adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "gpui", "cyberpunk"]
categories   = ["gui"]

[features]
default    = ["components", "charts", "shaders", "gpu"]
# Buttons, tables, dialogs, pickers, navigation, ...
components = []
# Charts only (always includes the theme, painting and motion core).
charts     = []
# CPU pixel shaders (cyberpunk, Material 3, Matrix, CRT, pixel art, ...) as `ShaderView`.
shaders    = ["dep:dodai-shaders", "dep:image"]
# Run shaders on the GPU (wgpu compute) when one is available; falls back to the CPU.
gpu        = ["shaders", "dep:dodai-shaders-gpu"]

[dependencies]
dodai-core = { workspace = true }
dodai-charts-core = { workspace = true }
dodai-cyberpunk-icons = { workspace = true }
gpui = { workspace = true }
dodai-shaders = { workspace = true, optional = true }
dodai-shaders-gpu = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, optional = true }

[[example]]
name = "gpui_showcase"
required-features = ["components", "charts"]

[dev-dependencies]
dodai = { workspace = true, features = ["cyberpunk", "material"] }
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "showcase_smoke"
required-features = ["components", "charts"]
