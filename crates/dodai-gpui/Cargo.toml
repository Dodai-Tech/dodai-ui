[package]
name         = "dodai-gpui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "GPUI adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "gpui", "cyberpunk"]
categories   = ["gui"]

[features]
default    = ["components", "charts", "shaders", "cyberpunk", "material", "neobrutalism", "dodai"]
# Buttons, tables, dialogs, pickers, navigation, ...
components = ["dep:dodai-icons"]
# Charts only (always includes the theme, painting and motion core).
charts     = []
# GPU pixel shaders (cyberpunk, Material 3, Matrix, CRT, pixel art, ...) as `ShaderView`.
shaders    = ["dep:dodai-shaders", "dep:image"]
# The Cyberpunk stroked icon pack: curve-free polylines (`Icon` on chamfered/square themes,
# and its modifier variants). Off: `IconName` is still there, but is drawn by the
# Material pack, so enable `material` too or icons draw nothing.
cyberpunk = ["dodai-core/cyberpunk"]
# Material Symbols glyphs: `Icon` follows the theme (rounded themes draw Material icons)
# (every design draws the same names).
material = ["dodai-core/material", "symbols"]
# The bold Neo-Brutalism icon pack (`Icon` on themes that declare `IconSet::Bold`).
neobrutalism = ["dodai-core/neobrutalism", "components", "dodai-icons/neobrutalism"]
# Dodai: draws Material Symbols icons (no Material components), and ships
# the frosted-glass scene and page grid.
dodai = ["dodai-core/dodai", "symbols", "frost"]
# Frosted glass (`FrostedScene`): a blurred copy of a picture behind panels, via `dodai-frost`.
frost = ["dep:dodai-frost", "dep:image"]
# Material Symbols glyphs, drawn by Material and Dodai.
symbols = ["components", "dodai-icons/material"]

[dependencies]
dodai-core = { workspace = true }
dodai-charts-core = { workspace = true }
dodai-fx = { workspace = true }
dodai-frost = { workspace = true, optional = true }
dodai-icons = { workspace = true, features = ["cyberpunk"], optional = true }
gpui = { workspace = true }
# Already in gpui's tree: tessellate icons once and replay the triangles each frame.
lyon_tessellation = "1"
dodai-shaders = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, optional = true }

[[example]]
name = "gpui_showcase"
required-features = ["components", "charts", "shaders", "cyberpunk", "material", "neobrutalism", "dodai"]

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "showcase_smoke"
required-features = ["components", "charts"]
