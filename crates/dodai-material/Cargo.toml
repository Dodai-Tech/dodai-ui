[package]
name         = "dodai-material"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "The Material 3 design system for Dodai UI: light and dark themes plus an optional Material Symbols icon catalogue"
readme       = "README.md"
keywords     = ["theme", "material", "material-design", "design-system"]
categories   = ["gui", "rendering"]

[features]
default = ["icons"]
## Re-export the Material Symbols catalogue as `dodai_material::icons` (outlined style).
icons = ["dep:dodai-icons", "dodai-icons/material"]
rounded = ["icons", "dodai-icons?/material-rounded"]
sharp   = ["icons", "dodai-icons?/material-sharp"]

[dependencies]
dodai-core = { workspace = true }
dodai-icons = { workspace = true, optional = true }
