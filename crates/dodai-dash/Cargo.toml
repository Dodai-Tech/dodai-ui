[package]
name                   = "dodai-dash"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description            = "A dashboard engine for the Dodai UI design system: a serialisable dashboard spec (TOML and JSON import and export), validation against a host-supplied metric catalogue, and toolkit-neutral view models; no storage, no ingestion, no rendering"
readme                 = "README.md"
keywords               = ["dashboard", "metrics", "visualization", "toml", "json"]
categories             = ["visualization", "config"]

[package.metadata.docs.rs]
features = ["schema"]

[features]
## A JSON Schema of the dashboard format (`dodai_dash::schema()`), for editors and validators.
schema = ["dep:schemars"]

[dependencies]
dodai-core    = { workspace = true }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_ignored = "0.1"
toml          = "1"
schemars      = { version = "1", optional = true }

[[example]]
name              = "schema"
required-features = ["schema"]
