[package]
name         = "legendary-iced"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "Iced adapter for the Legendary Themes design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "iced", "cyberpunk"]
categories   = ["gui"]

[dependencies]
legendary-core = { workspace = true }
iced = { workspace = true }

[dev-dependencies]
# Workspace-only workaround: gpui pulls naga 25 which enables codespan-reporting's
# `termcolor`; naga 27 (iced/wgpu) then fails to build unless its own `termcolor`
# feature is on too. Lets `cargo test/clippy --workspace` unify both GUI stacks.
naga = { version = "27", default-features = false, features = ["termcolor"] }
