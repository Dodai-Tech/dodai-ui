[package]
name         = "dodai-ui-bevy"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version = "1.97"
description  = "Bevy 0.20 bevy_ui components for the Dodai UI design system: themed widgets, a chamfer material with hard shadows, frosted glass and scanlines"
readme       = "README.md"
keywords     = ["theme", "design-system", "bevy", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material", "neobrutalism", "dodai", "icons", "symbols", "system-fonts"]
# Design systems to bundle (features of `dodai-ui-core`).
cyberpunk = ["dodai-ui-core/cyberpunk"]
material  = ["dodai-ui-core/material"]
neobrutalism = ["dodai-ui-core/neobrutalism"]
dodai     = ["dodai-ui-core/dodai"]
## `icon()` widget (Material Symbols + Cyberpunk pack, chosen by the theme shape).
icons     = ["dep:dodai-ui-icons", "dodai-ui-icons/theme", "dodai-ui-icons/cyberpunk", "dodai-ui-icons/material", "dodai-ui-icons/neobrutalism"]
## `symbol()` widget: the original dashboard symbols, drawn in the design's own style.
symbols   = ["icons", "dodai-ui-icons/symbols"]
## Resolve the design's font stacks (`Typography::body` etc.) from the installed fonts instead of
## the bundled ASCII-only face.
system-fonts = ["bevy/system_font_discovery"]

[dependencies]
dodai-ui-core = { workspace = true }
dodai-ui-icons = { workspace = true, optional = true }
dodai-ui-fx = { workspace = true }
dodai-ui-frost = { workspace = true }
bevy = { version = "0.20", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_winit", "bevy_window",
  "ui_api", "ui_picking", "ui_bevy_render", "default_font", "bevy_log", "x11", "wayland",
] }

[dev-dependencies]
dodai-ui-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }

[dev-dependencies.bevy]
version = "0.20"
default-features = false
features = ["bevy_clipboard", "system_clipboard"]

[dev-dependencies.dodai-ui-showcase-model]
workspace = true

[dev-dependencies.dodai-ui-shaders]
workspace = true
features = ["bevy"]
