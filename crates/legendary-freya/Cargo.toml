[package]
name         = "legendary-freya"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "freya adapter for the Legendary UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "freya", "cyberpunk"]
categories   = ["gui"]

[dependencies]
legendary-core = { workspace = true }
freya = { version = "0.3.4", optional = true }

[features]
default = ["ui"]
# Freya components + showcase. Disable for the pure token->style mapping layer.
ui = ["dep:freya"]

[[example]]
name = "freya_showcase"
required-features = ["ui"]
