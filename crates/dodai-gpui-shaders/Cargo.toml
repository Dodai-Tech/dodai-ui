[package]
name                   = "dodai-gpui-shaders"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description            = "GPU pixel shaders for gpui in the Dodai designs, as a live `ShaderView`"
keywords               = ["shaders", "gpui", "gpu", "effects"]
categories             = ["gui", "graphics"]

[dependencies]
dodai-core    = { workspace = true }
dodai-gpui    = { workspace = true }
dodai-shaders = { workspace = true }
gpui          = { workspace = true }
image         = { version = "0.25", default-features = false }
