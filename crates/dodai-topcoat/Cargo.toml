[package]
name         = "dodai-topcoat"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "Web layer of the Dodai UI design system: CSS custom properties and .dodai-* component classes generated from the themes, with clip-path chamfers"
readme       = "README.md"
keywords     = ["theme", "design-system", "topcoat", "cyberpunk"]
categories   = ["gui"]

[dependencies]
dodai-core = { workspace = true }
# The `html` module draws icons inline.
dodai-icons = { workspace = true, features = ["theme", "cyberpunk", "material", "material-rounded", "material-sharp", "neobrutalism"] }

[dev-dependencies]
dodai-showcase-model = { workspace = true }
dodai-shaders = { workspace = true }
# The shader pictures of the showcase example are PNG.
png = "0.18"
dodai-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }

[[example]]
name = "topcoat_showcase"
path = "examples/topcoat_showcase/main.rs"
