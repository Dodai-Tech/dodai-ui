[package]
name         = "dodai-ratatui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "Ratatui adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "ratatui", "cyberpunk"]
categories   = ["gui"]

[dependencies]
dodai-core = { workspace = true }
ratatui = { workspace = true }
tui-nuances = "0.1.7"
tui-chart = { version = "0.1", features = ["theme"] }
tui-piechart = { version = "1.1", features = ["theme"] }
tui-spinner = { version = "0.5", features = ["theme"] }
tui-rating = { version = "0.4", features = ["theme"] }
tui-slider = { version = "0.4", features = ["theme"] }
tui-checkbox = { version = "0.5", features = ["theme"] }

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material"] }
crossterm = { workspace = true }
