[package]
name                   = "dodai-fx"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description            = "Self-contained visual effects, no dependencies by default: surface textures and animated effects drawn through a tiny Painter trait."
readme                 = "README.md"
keywords               = ["effects", "texture", "surface", "ui"]
categories             = ["graphics", "gui"]

[features]
default = []
# `dodai_fx::frost`: the pixel blur of frosted glass (the `dodai-frost` crate, CPU).
frost = ["dep:dodai-frost"]
# The same blur on the GPU (wgpu); falls back to the CPU without an adapter.
frost-gpu = ["frost", "dodai-frost/gpu"]

[dependencies]
dodai-frost = { workspace = true, optional = true }
