[package]
name         = "legendary-dioxus"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "dioxus adapter for the Legendary UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "dioxus", "cyberpunk"]
categories   = ["gui"]

[dependencies]
legendary-core = { workspace = true }
legendary-topcoat = { workspace = true }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }

[dev-dependencies]
dioxus-ssr = "0.7"

[[example]]
name = "dioxus_showcase"
path = "examples/dioxus_showcase.rs"
