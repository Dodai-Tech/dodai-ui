[package]
name         = "dodai-slint"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "slint adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "slint", "cyberpunk"]
categories   = ["gui"]

[dependencies]
dodai-core = { workspace = true }
slint = "1"

[dev-dependencies]
dodai = { workspace = true, features = ["cyberpunk", "material"] }
