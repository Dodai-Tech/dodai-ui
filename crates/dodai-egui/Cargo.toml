[package]
name         = "dodai-egui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "egui adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "egui", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material"]
# Design systems to bundle (each is its own crate; see `dodai`).
cyberpunk = ["dodai/cyberpunk"]
material  = ["dodai/material"]

[dependencies]
dodai-core = { workspace = true }
dodai = { workspace = true }
egui = "0.32"

[dev-dependencies]
dodai = { workspace = true, features = ["cyberpunk", "material"] }
eframe = "0.32"
