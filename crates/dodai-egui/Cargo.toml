[package]
name         = "dodai-egui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "egui adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "egui", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material", "neobrutalism", "dodai", "icons"]
# Design systems to bundle (features of `dodai-core`).
cyberpunk = ["dodai-core/cyberpunk"]
material  = ["dodai-core/material"]
neobrutalism = ["dodai-core/neobrutalism"]
dodai   = ["dodai-core/dodai"]
# The `Icon` widget (every design draws every shared icon in its own pack).
icons     = ["dep:dodai-icons", "dodai-icons/cyberpunk", "dodai-icons/material", "dodai-icons/neobrutalism"]

[dependencies]
dodai-core = { workspace = true }
dodai-icons = { workspace = true, optional = true }
egui = "0.37"

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
eframe = "0.37"
