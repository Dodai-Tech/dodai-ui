[package]
name         = "dodai-iced"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "Iced adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "iced", "cyberpunk"]
categories   = ["gui"]

[features]
default = ["icons"]
## `icon()`: the shared icon vocabulary drawn on a canvas in the design's own style.
icons = ["dep:dodai-icons", "dodai-icons/theme", "dodai-icons/cyberpunk", "dodai-icons/material", "dodai-icons/neobrutalism"]

[dependencies]
dodai-core = { workspace = true }
dodai-icons = { workspace = true, optional = true }
dodai-fx = { workspace = true }
iced = { workspace = true }

[dev-dependencies]
# The showcase measures its sections to scroll to them and to follow the scroll.
iced = { workspace = true, features = ["selector"] }
dodai-core = { workspace = true, features = ["cyberpunk", "material"] }
# Workspace-only workaround: gpui pulls naga 25 which enables codespan-reporting's
# `termcolor`; naga 27 (iced/wgpu) then fails to build unless its own `termcolor`
# feature is on too. Lets `cargo test/clippy --workspace` unify both GUI stacks.
naga = { version = "27", default-features = false, features = ["termcolor"] }
dodai-showcase-model = { workspace = true }
dodai-shaders = { workspace = true, features = ["iced"] }
