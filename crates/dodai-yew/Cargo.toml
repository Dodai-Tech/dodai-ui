[package]
name         = "dodai-yew"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "yew adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "yew", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material"]
# Design systems to bundle (features of `dodai-core`).
cyberpunk = ["dodai-core/cyberpunk"]
material  = ["dodai-core/material"]

[dependencies]
dodai-core = { workspace = true }
dodai-topcoat.workspace = true
web-sys = { version = "0.3.107", features = ["HtmlInputElement"] }
yew = { version = "0.23", features = ["ssr"] }

[dev-dependencies]
# The showcase page inlines the logo as a data: URL.
base64 = "0.22"
dodai-core = { workspace = true, features = ["cyberpunk", "material"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
