[package]
name         = "legendary-bevy"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "bevy adapter for the Legendary UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "bevy", "cyberpunk"]
categories   = ["gui"]

[dependencies]
legendary-core = { workspace = true }
bevy = { version = "0.18", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_winit", "bevy_window",
  "ui_api", "ui_bevy_render", "default_font", "bevy_log",
] }
