[package]
name         = "dodai-freya"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "freya adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "freya", "cyberpunk"]
categories   = ["gui"]

[dependencies]
dodai-core = { workspace = true }
dodai = { workspace = true }
freya = { version = "0.3.4", optional = true }

[features]
cyberpunk = ["dodai/cyberpunk"]
material  = ["dodai/material"]
default = ["ui", "cyberpunk", "material"]
# Freya components + showcase. Disable for the pure token->style mapping layer.
ui = ["dep:freya"]

[[example]]
name = "freya_showcase"
required-features = ["ui"]

[dev-dependencies]
dodai = { workspace = true, features = ["cyberpunk", "material"] }
