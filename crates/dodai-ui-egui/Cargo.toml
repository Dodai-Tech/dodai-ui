[package]
name         = "dodai-ui-egui"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "egui adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "egui", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material", "neobrutalism", "dodai", "icons"]
# Design systems to bundle (features of `dodai-ui-core`).
cyberpunk = ["dodai-ui-core/cyberpunk"]
material  = ["dodai-ui-core/material"]
neobrutalism = ["dodai-ui-core/neobrutalism"]
dodai   = ["dodai-ui-core/dodai"]
# The `Icon` widget (every design draws every shared icon in its own pack).
icons     = ["dep:dodai-ui-icons", "dodai-ui-icons/theme", "dodai-ui-icons/cyberpunk", "dodai-ui-icons/material", "dodai-ui-icons/neobrutalism"]

[dependencies]
dodai-ui-core = { workspace = true }
dodai-ui-fx = { workspace = true }
dodai-ui-icons = { workspace = true, optional = true }
egui = "0.37"

[dev-dependencies]
dodai-ui-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
eframe = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dodai-ui-showcase-model = { workspace = true }
dodai-ui-shaders = { workspace = true }
dodai-ui-icons = { workspace = true, features = ["theme", "cyberpunk", "material", "neobrutalism"] }
