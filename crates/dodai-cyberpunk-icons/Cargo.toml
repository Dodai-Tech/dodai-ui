[package]
name         = "dodai-cyberpunk-icons"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "Cyberpunk-style vector icon pack (136 chamfered, curve-free 24x24 polyline icons) for the Dodai UI design system. Self-contained, no dependencies."
readme       = "README.md"
keywords     = ["icons", "design-system", "vector", "ui"]
categories   = ["gui", "graphics"]

[features]
default = ["shapes"]
# The polyline geometry, SVG export and name lookup. Off: only `IconName`, `ALL`, `name()`,
# `group()` and `from_name()` are compiled (for hosts that draw the names with another pack).
shapes = []

[dependencies]
dodai-icon-id = { workspace = true }
