[package]
name         = "legendary-yew"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "yew adapter for the Legendary UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "yew", "cyberpunk"]
categories   = ["gui"]

[dependencies]
legendary-core = { workspace = true }
legendary-topcoat.workspace = true
web-sys = { version = "0.3.106", features = ["HtmlInputElement"] }
yew = { version = "0.21", features = ["ssr"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros"] }
