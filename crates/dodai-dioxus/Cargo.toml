[package]
name         = "dodai-dioxus"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "dioxus adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "dioxus", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material", "icons"]
# Design systems to bundle (each is its own crate; see `dodai`).
cyberpunk = ["dodai-core/cyberpunk"]
material  = ["dodai-core/material"]
## `Icon` component (Material Symbols + Cyberpunk pack, chosen by the theme shape).
icons     = ["dep:dodai-icons", "dodai-icons/cyberpunk", "dodai-icons/material"]

[dependencies]
dodai-core = { workspace = true }
dodai-icons = { workspace = true, optional = true }
dodai-topcoat = { workspace = true }
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material"] }
dioxus-ssr = "0.7"

[[example]]
name = "dioxus_showcase"
path = "examples/dioxus_showcase.rs"
