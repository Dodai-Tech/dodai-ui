[package]
name         = "dodai-bevy"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "bevy adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "bevy", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material", "neobrutalism", "dodai", "icons", "symbols", "system-fonts"]
# Design systems to bundle (features of `dodai-core`).
cyberpunk = ["dodai-core/cyberpunk"]
material  = ["dodai-core/material"]
neobrutalism = ["dodai-core/neobrutalism"]
dodai     = ["dodai-core/dodai"]
## `icon()` widget (Material Symbols + Cyberpunk pack, chosen by the theme shape).
icons     = ["dep:dodai-icons", "dodai-icons/theme", "dodai-icons/cyberpunk", "dodai-icons/material", "dodai-icons/neobrutalism"]
## `symbol()` widget: the original dashboard symbols, drawn in the design's own style.
symbols   = ["icons", "dodai-icons/symbols"]
## Resolve the design's font stacks (`Typography::body` etc.) from the installed fonts instead of
## the bundled ASCII-only face.
system-fonts = ["bevy/system_font_discovery"]

[dependencies]
dodai-core = { workspace = true }
dodai-icons = { workspace = true, optional = true }
dodai-fx = { workspace = true }
dodai-instruments-core = { workspace = true }
bevy = { version = "0.20", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_winit", "bevy_window",
  "ui_api", "ui_picking", "ui_bevy_render", "default_font", "bevy_log", "x11", "wayland",
] }

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }

[dev-dependencies.dodai-showcase-model]
workspace = true
