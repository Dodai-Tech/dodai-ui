[package]
name         = "dodai-bevy"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description  = "bevy adapter for the Dodai UI design system"
readme       = "README.md"
keywords     = ["theme", "design-system", "bevy", "cyberpunk"]
categories   = ["gui"]

[features]
default   = ["cyberpunk", "material", "icons"]
# Design systems to bundle (features of `dodai-core`).
cyberpunk = ["dodai-core/cyberpunk"]
material  = ["dodai-core/material"]
## `icon()` widget (Material Symbols + Cyberpunk pack, chosen by the theme shape).
icons     = ["dep:dodai-icons"]

[dependencies]
dodai-core = { workspace = true }
dodai-icons = { workspace = true, optional = true }
dodai-fx = { workspace = true }
bevy = { version = "0.20", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_winit", "bevy_window",
  "ui_api", "ui_picking", "ui_bevy_render", "default_font", "bevy_log", "x11", "wayland",
] }

[dev-dependencies]
dodai-core = { workspace = true, features = ["cyberpunk", "material"] }
