[package]
name                   = "dodai-showcase-model"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
description            = "Toolkit-neutral model of the Dodai showcase: pages, sections and demo widgets as data, so every toolkit renders the same showcase."
publish                = false

[dependencies]
dodai-core  = { workspace = true, features = ["cyberpunk", "material", "neobrutalism", "dodai"] }
dodai-icons = { workspace = true, features = ["theme", "cyberpunk", "material", "neobrutalism"] }
dodai-shaders = { workspace = true }
# The clock demo shows local time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The image demos decode the sample picture once (toolkits get pixels or a data URL).
png = "0.18"
base64 = "0.22"
# The frosted-glass demo blurs its picture once (CPU).
dodai-frost = { workspace = true }
