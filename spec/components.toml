# Component spec: the one place that says how a component's tokens reach a toolkit.
# `scripts/gen-components.nu` turns it into a plain-Rust `generated.rs` per toolkit crate
# (the state -> token -> native value glue). Drawing stays hand-written and reads the
# generated style. Field kinds: `color`, `opt_color` (a target with `transparent` turns none
# into that colour, a target without it keeps an `Option`).
# `resolver` is the `Theme` method that returns `tokens`; `args` are its parameters.

[[component]]
name = "tag"
doc = "Tag / badge: solid fills with the tone, otherwise outlined."
resolver = "tag"
args = [{ name = "tone", ty = "Tone" }, { name = "solid", ty = "bool" }]
fields = [
  { name = "background", kind = "opt_color" },
  { name = "foreground", kind = "color" },
  { name = "border", kind = "opt_color" },
]

[[component]]
name = "panel"
doc = "Container surface; `focused` highlights the border."
resolver = "panel"
args = [{ name = "focused", ty = "bool" }]
fields = [
  { name = "background", kind = "color" },
  { name = "border", kind = "color" },
  { name = "title", kind = "color" },
]

[target.xilem]
path = "crates/dodai-xilem/src/generated.rs"
color_ty = "xilem::Color"
convert = "crate::color"
transparent = "xilem::Color::TRANSPARENT"
