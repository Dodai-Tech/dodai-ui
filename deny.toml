# cargo-deny configuration: `cargo deny check`
[graph]
all-features = false

[advisories]
version = 2
ignore = [
    # Unmaintained crates reached only through the optional GUI/toolkit backends (slint, iced,
    # freya, bevy, gpui); none ships in the core, design or token crates. No safe upgrade yet.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0052",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # pin-utils, via gpui -> gpui_http_client -> zed-async-tar -> async-std.
    "RUSTSEC-2026-0441",
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "BSL-1.0", "Unlicense",
    "WTFPL", "CC0-1.0", "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "0BSD", "MIT-0", "NCSA",
    # dodai-slint users pick the Slint licence they accept; the royalty-free one is allowed here.
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
